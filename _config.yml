url: http://haroon.amanullah.org

plugins:
  - jekyll-feed

feed:
  collections:
    journal:
      path: "/journal-feed.xml"

timezone: America/New_York

exclude:
  - .vscode/
  - .github/
  - Gemfile
  - Gemfile.lock
  - README.md

collections:
  nodes:
    output: true
    permalink: /nodes/:path
  projects:
    output: true
    permalink: /projects/:path
  journal:
    output: true
    permalink: /journal/:path
  writings:
    output: true
    permalink: /writings/:path
  books:
    output: true
    permalink: /books/:path