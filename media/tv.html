layout: new_default

<section id="tv-background">
    <div id="tv">
        <!-- Target container for YouTube API (Use DIV instead of IFRAME) -->
        <div id="tv-screen"></div>

        <div id="tv-shading"></div>

        <div id="tv-controls">
            <button onclick="changeChannel()">></button>
        </div>
    </div>
</section>

<script>
    const originalList = [
        "Og7S-sk4GVs", "ff0J91_ePAw", "d1DaDiWkYxs", "4PUIxEWmsvI", 
        "5qjnDd1rsII", "E8X4pVVYWn8", "IvUU8joBb1Q", "wO61D9x6lNY", 
        "9XClfe95mbI", "AqA71cWs1WA", "XPm7zy-X_fI", "JUp9pCtn2BY", 
        "4mkkIdR4eLk", "5AhZh4A7NLM", "vyDvpwpRPM4", "DPIoje1nfCQ", 
        "Cqd1Gvq-RBY", "PIOQWIvdUoM", "I787v-so8fo", "6FF1p--Zfjw", 
        "ctRembqQCcw", "W86cTIoMv2U", "9FX34TjJe-c", "YG8wLT8SFiw", 
        "I27kmmpiJl0", "MNLtEME8B_c"
    ];
    
    let deck = [];
    let player;

    function getNextVideo() {
        if (deck.length === 0) {
            deck = [...originalList].sort(() => Math.random() - 0.5);
        }
        return deck.pop();
    }

    // Biased timestamp generator (returns integer seconds)
    function getRandomStart() {
        if (Math.random() < 0.7) {
            return Math.floor(Math.random() * 30); // 0-30 seconds
        } else {
            return Math.floor(Math.pow(Math.random(), 3) * 120); // Skewed 0-120s
        }
    }

    // Global API ready callback MUST be defined before loading the API script
    window.onYouTubeIframeAPIReady = function() {
        const initialVideo = getNextVideo();
        const initialStart = getRandomStart();

        player = new YT.Player('tv-screen', {
            height: '315',
            width: '560',
            videoId: initialVideo,
            playerVars: {
                'autoplay': 1,
                'controls': 0,
                'cc_load_policy': 0,
                'start': initialStart,
                'mute': 1,
                'enablejsapi': 1,
                'origin': window.location.origin
            },
            events: {
                'onReady': function(event) {
                    event.target.playVideo();
                }
            }
        });
    };

    function changeChannel() {
        if (player && typeof player.loadVideoById === 'function') {
            const nextVideo = getNextVideo();
            const startSec = getRandomStart();

            // Native API start parameter (bypasses seekTo state loop)
            player.loadVideoById({
                videoId: nextVideo,
                startSeconds: startSec
            });
            player.unMute(); // Unmute on explicit button click
        }
    }
</script>

<!-- API script MUST come AFTER onYouTubeIframeAPIReady is declared -->
<script src="https://www.youtube.com/iframe_api"></script>
