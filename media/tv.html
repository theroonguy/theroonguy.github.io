<section id="tv-background">
    <div id="tv">
        <iframe id="tv-screen" width="560" height="315" src="" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>

        <div id="tv-shading"></div>

        <div id="tv-controls">
            <button onclick="changeChannel()">></button>
        </div>
    </div>
</section>

<script src="https://www.youtube.com/iframe_api"></script>

<script>
  // List of YouTube Video IDs (the string after 'v=' in a YouTube URL)
    const originalList = [
        "Og7S-sk4GVs", // Podcast Host Can't Stop Laughing at Guy's Ticks 
        "ff0J91_ePAw", // chuck mcgill open verse
        "d1DaDiWkYxs", // ai mike
        "4PUIxEWmsvI", // world of tomorrow
        "5qjnDd1rsII", // potato war
        "E8X4pVVYWn8", // dynamo dream ep3
        "IvUU8joBb1Q", // marble machine
        "wO61D9x6lNY", // outside in
        "9XClfe95mbI", // crab battle
        "AqA71cWs1WA", // hyperbole
        "XPm7zy-X_fI", // volta
        "JUp9pCtn2BY", // wilford
        "4mkkIdR4eLk", // perfect day/something stupid
        "5AhZh4A7NLM", // i want to die
        "vyDvpwpRPM4", // world's wierdest animals
        "DPIoje1nfCQ", // blinker
        "Cqd1Gvq-RBY", // numa numa
        "PIOQWIvdUoM", // vigs
        "I787v-so8fo", // jazzy creep
        "6FF1p--Zfjw", // so
        "ctRembqQCcw", // isle unto thyself
        "W86cTIoMv2U", // smallest cat
        "9FX34TjJe-c", // carrie and lowell
        "YG8wLT8SFiw", // mercury
        "I27kmmpiJl0", // midnight moon
        "MNLtEME8B_c", // electronic labyrinth
    ];
    
    let deck = [];
    let player;

    function getNextVideo() {
        if (deck.length === 0) {
            deck = [...originalList].sort(() => Math.random() - 0.5);
        }
        return deck.pop();
    }

    // 1. YouTube API automatically calls this when ready
    function onYouTubeIframeAPIReady() {
        player = new YT.Player('tv-screen', {
        videoId: getNextVideo(),
        playerVars: {
            'autoplay': 1,
            'controls': 0,
            'cc_load_policy': 0
        },
        events: {
            'onReady': onPlayerReady,
            'onStateChange': onPlayerStateChange
        }
        });
    }

    // 2. Triggers when initial video is loaded
    function onPlayerReady(event) {
        jumpToRandomTime();
    }

    // 3. Triggers when switching videos on channel change
    function onPlayerStateChange(event) {
        // When a new video starts playing (state === 1), seek to random timestamp
        if (event.data === YT.PlayerState.PLAYING && !event.target.hasSeeked) {
        event.target.hasSeeked = true; // Prevent infinite loop when seekTo triggers play
        jumpToRandomTime();
        }
    }

    function jumpToRandomTime() {
        const duration = player.getDuration();
        if (duration > 0) {
        const randomStartTime = getBiasedTimestamp(duration);
        player.seekTo(randomStartTime, true);
        player.playVideo();
        }
    }

    function getBiasedTimestamp(duration) {
        let targetTime;
        if (Math.random() < 0.7) {
        targetTime = Math.random() * Math.min(30, duration);
        } else {
        targetTime = Math.pow(Math.random(), 3) * duration;
        }
        return targetTime;
    }

    // 4. Call this from your "Next Channel" button
    function changeChannel() {
        if (player && player.loadVideoById) {
        player.hasSeeked = false; // Reset flag for new video
        player.loadVideoById(getNextVideo());
        }
    }

    // Load a random video on initial page load
    window.onload = changeChannel;
</script>
