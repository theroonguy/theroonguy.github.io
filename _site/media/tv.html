  <body>
        
    <section id="tv-background">
    <div id="tv">
        <!-- Target container for YouTube API (Use DIV instead of IFRAME) -->
        <div id="tv-screen"></div>

        <div id="tv-shading"></div>

        <div id="tv-controls">
            <button id="restart" onclick="restart()"><<</button>
            <button id="pause" onclick="pause()">=</button>
            <button id="play" onclick="play()">></button>
            <button id="skip" onclick="changeChannel()">>></button>
        </div>
    </div>
</section>

<script>
    const originalList = [
        "Og7S-sk4GVs", // Podcast Host Can't Stop Laughing at Guy's Ticks
        "ff0J91_ePAw", // chuck mcgill open verse
        "d1DaDiWkYxs", // ai mike
        "4PUIxEWmsvI", // world of tomorrow
        "5qjnDd1rsII", // potato war
        "E8X4pVVYWn8", // dynamo dream ep3
        "IvUU8joBb1Q", // marble machine
        "wO61D9x6lNY", // outside in
        "9XClfe95mbI", // crab battle
        "AqA71cWs1WA", // hyperbole
        "XPm7zy-X_fI", // volta
        "JUp9pCtn2BY", // wilford
        "4mkkIdR4eLk", // perfect day/something stupid
        "5AhZh4A7NLM", // i want to die
        "vyDvpwpRPM4", // world's wierdest animals
        "DPIoje1nfCQ", // blinker
        "Cqd1Gvq-RBY", // numa numa
        "PIOQWIvdUoM", // vigs
        "I787v-so8fo", // jazzy creep
        "6FF1p--Zfjw", // so
        "ctRembqQCcw", // isle unto thyself
        "W86cTIoMv2U", // smallest cat
        "9FX34TjJe-c", // carrie and lowell
        "YG8wLT8SFiw", // mercury
        "I27kmmpiJl0", // midnight moon
        "MNLtEME8B_c", // electronic labyrinth
    ]; 
    
    let deck = [];
    let player;

    function getNextVideo() {
        if (deck.length === 0) {
            deck = [...originalList].sort(() => Math.random() - 0.5);
        }
        return deck.pop();
    }

    // Biased timestamp generator (returns integer seconds)
    function getRandomStart() {
        if (Math.random() < 0.7) {
            return Math.floor(Math.random() * 30); // 0-30 seconds
        } else {
            return Math.floor(Math.pow(Math.random(), 3) * 120); // Skewed 0-120s
        }
    }

    // Global API ready callback MUST be defined before loading the API script
    window.onYouTubeIframeAPIReady = function() {
        const initialVideo = getNextVideo();
        const initialStart = getRandomStart();

        player = new YT.Player('tv-screen', {
            height: '315',
            width: '560',
            videoId: initialVideo,
            playerVars: {
                'autoplay': 1,
                'controls': 0,
                'cc_load_policy': 0,
                'start': initialStart,
                'mute': 1,
                'enablejsapi': 1,
                'origin': window.location.origin
            },
            events: {
                'onReady': function(event) {
                    event.target.playVideo();
                }
            }
        });
    };

    function changeChannel() {
        if (player && typeof player.loadVideoById === 'function') {
            const nextVideo = getNextVideo();
            const startSec = getRandomStart();

            // Native API start parameter (bypasses seekTo state loop)
            player.loadVideoById({
                videoId: nextVideo,
                startSeconds: startSec
            });
            player.unMute(); // Unmute on explicit button click
        }
    }

    function pause() {
        if (player && typeof player.loadVideoById === 'function') {
            player.pauseVideo();
        }
    }

    function play() {
        if (player && typeof player.loadVideoById === 'function') {
            player.playVideo();
        }
    }

    function restart() {
        if (player && typeof player.loadVideoById === 'function') {
            player.seekTo(0);
            player.playVideo();
        }
    }
</script>

<!-- API script MUST come AFTER onYouTubeIframeAPIReady is declared -->
<script src="https://www.youtube.com/iframe_api"></script>

    </div>
